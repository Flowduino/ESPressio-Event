<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.section{font-size:16px;font-weight:700}.node{fill:#fff;stroke:#222;stroke-width:2}.label{font-size:15px;font-weight:600;text-anchor:middle}.small{font-size:12px;text-anchor:middle}.note{font-size:13px}.edge{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}.optional{stroke-dasharray:7 6}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<text class="title" x="35" y="42">ESPressio Dependency Architecture — Current Released Generation</text><text class="section" x="35" y="78">Foundational / domain</text>
<rect class="node" x="35" y="95" width="180" height="58" rx="8"/><text class="label" x="125" y="128">Observable 3.0.1</text><rect class="node" x="235" y="95" width="190" height="58" rx="8"/><text class="label" x="330" y="128">Serializable 0.10.2</text><rect class="node" x="445" y="95" width="150" height="58" rx="8"/><text class="label" x="520" y="128">Units 0.2.3</text><rect class="node" x="615" y="95" width="175" height="58" rx="8"/><text class="label" x="702" y="128">Command 1.0.0</text><rect class="node" x="810" y="95" width="175" height="58" rx="8"/><text class="label" x="897" y="128">Security 0.3.0</text><path class="edge optional" d="M485 153 L365 153"/><path class="edge" d="M660 153 L210 130"/><path class="edge" d="M850 153 L215 140"/>
<text class="section" x="35" y="205">Runtime / execution</text><rect class="node" x="300" y="225" width="180" height="58" rx="8"/><text class="label" x="390" y="258">Timing 2.2.4</text><rect class="node" x="570" y="225" width="180" height="58" rx="8"/><text class="label" x="660" y="258">Threads 3.1.4</text><path class="edge" d="M370 225 L520 153"/><path class="edge" d="M335 225 L165 153"/><path class="edge" d="M625 225 L435 270"/><path class="edge" d="M600 225 L180 153"/>
<text class="section" x="35" y="335">Generic Event mechanism</text><rect class="node" x="480" y="355" width="220" height="68" rx="8"/><text class="label" x="590" y="386">Event 6.0.0</text><text class="small" x="590" y="405">mechanism-only for external domains</text><path class="edge" d="M555 355 L640 283"/><path class="edge" d="M520 355 L420 283"/><path class="edge" d="M495 355 L175 153"/><path class="edge optional" d="M520 355 L340 153"/><path class="edge optional" d="M690 125 L650 355"/><path class="edge optional" d="M890 153 L665 355"/>
