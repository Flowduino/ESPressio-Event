<text class="section" x="35" y="640">Diagnostics / operator</text><rect class="node" x="430" y="665" width="340" height="92" rx="8"/><text class="label" x="600" y="695">Serial 0.7.2</text><text class="small" x="600" y="718">core: no ESPressio dependencies</text><text class="small" x="600" y="738">all subsystem integrations are opt-in</text><path class="edge optional" d="M500 665 L375 577"/><path class="edge optional" d="M700 665 L805 577"/><path class="edge optional" d="M600 665 L600 423"/>
<text class="note" x="35" y="810">Solid arrows: required dependencies. Dashed arrows: opt-in integrations. See ESPRESSIO_DEPENDENCY_CHART.md for the exhaustive edge list.</text><text class="note" x="35" y="836">Event has no reverse dependency on Command, Security, Sockets, or ESP-Now. Concrete domain Event integrations are owned downstream.</text><text class="note" x="35" y="862">Tree is standalone; WiFi currently has no implemented public API and is not an edge in this released graph.</text></svg>
