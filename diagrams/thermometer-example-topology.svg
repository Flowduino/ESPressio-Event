<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 2000 1100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #172033; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #536078; }
      .box { stroke-width: 3; rx: 15; }
      .module { fill: #dcfce7; stroke: #16a34a; }
      .event { fill: #fef3c7; stroke: #d97706; }
      .manager { fill: #e0f2fe; stroke: #0284c7; }
      .base { fill: #e2e8f0; stroke: #64748b; }
      .thread-zone { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 10 8; rx: 20; }
      .name { font-size: 25px; font-weight: 700; text-anchor: middle; }
      .kind { font-size: 17px; font-style: italic; fill: #526176; text-anchor: middle; }
      .detail { font-size: 17px; fill: #334155; text-anchor: middle; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 5; marker-end: url(#arrow); }
      .inherit { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#triangle); }
      .none { fill: none; stroke: #dc2626; stroke-width: 3; stroke-dasharray: 10 8; }
      .flow-label { font-size: 18px; font-weight: 600; fill: #1d4ed8; text-anchor: middle; }
      .note { font-size: 18px; font-weight: 600; fill: #b91c1c; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="2"/>
    </marker>
    <marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="2000" height="1100" fill="#fff"/>
  <text x="65" y="65" class="title">Thermometer Example — Decoupled Event Topology</text>
  <text x="65" y="100" class="subtitle">Application modules share no references: communication occurs only through TemperatureChangeEvent and the ESPressio EventManager.</text>

  <!-- producer -->
  <rect x="70" y="250" width="360" height="170" class="box module"/>
  <text x="250" y="292" class="kind">«independent producer module»</text>
  <text x="250" y="335" class="name">Thermometer</text>
  <text x="250" y="372" class="detail">reads the sensor</text>
  <text x="250" y="398" class="detail">creates and queues an event</text>

  <!-- event and manager -->
  <rect x="585" y="255" width="390" height="160" class="box event"/>
  <text x="780" y="297" class="kind">«event contract»</text>
  <text x="780" y="340" class="name">TemperatureChangeEvent</text>
  <text x="780" y="378" class="detail">immutable temperature payload</text>

  <rect x="1115" y="255" width="340" height="160" class="box manager"/>
  <text x="1285" y="297" class="kind">«library singleton»</text>
  <text x="1285" y="340" class="name">EventManager</text>
  <text x="1285" y="378" class="detail">routes by event type</text>

  <path d="M430 335 L585 335" class="flow"/>
  <text x="507" y="315" class="flow-label">Queue()</text>
  <path d="M975 335 L1115 335" class="flow"/>
  <text x="1045" y="315" class="flow-label">dispatch</text>

  <!-- consumers zone -->
  <rect x="1510" y="145" width="430" height="720" class="thread-zone"/>
  <text x="1725" y="185" class="detail">Independent EventThread modules</text>

  <rect x="1560" y="250" width="330" height="170" class="box module"/>
  <text x="1725" y="292" class="kind">«EventThread»</text>
  <text x="1725" y="335" class="name">TemperatureSerialLogger</text>
  <text x="1725" y="372" class="detail">listens for TemperatureChangeEvent</text>
  <text x="1725" y="398" class="detail">writes to Serial</text>

  <rect x="1560" y="610" width="330" height="170" class="box module"/>
  <text x="1725" y="652" class="kind">«EventThread»</text>
  <text x="1725" y="695" class="name">TemperatureDisplay</text>
  <text x="1725" y="732" class="detail">listens for TemperatureChangeEvent</text>
  <text x="1725" y="758" class="detail">renders to the display</text>

  <path d="M1455 320 C1500 320 1515 335 1560 335" class="flow"/>
  <text x="1505" y="298" class="flow-label">deliver</text>
  <path d="M1285 415 C1285 695 1440 695 1560 695" class="flow"/>
  <text x="1410" y="670" class="flow-label">deliver</text>

  <!-- inheritance context -->
  <rect x="585" y="700" width="390" height="110" class="box base"/>
  <text x="780" y="742" class="kind">«library base»</text>
  <text x="780" y="780" class="name">Event</text>
  <path d="M780 700 L780 415" class="inherit"/>

  <rect x="1115" y="700" width="340" height="110" class="box base"/>
  <text x="1285" y="742" class="kind">«library base»</text>
  <text x="1285" y="780" class="name">EventThread</text>
  <path d="M1455 755 C1505 755 1505 390 1560 390" class="inherit"/>
  <path d="M1455 755 L1560 755" class="inherit"/>

  <!-- explicit non-relationship -->
  <path d="M1725 420 L1725 610" class="none"/>
  <line x1="1698" y1="500" x2="1752" y2="554" stroke="#dc2626" stroke-width="6"/>
  <line x1="1752" y1="500" x2="1698" y2="554" stroke="#dc2626" stroke-width="6"/>
  <text x="1725" y="575" class="note">no reference or dependency</text>

  <rect x="70" y="900" width="1870" height="125" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="1005" y="948" class="note">No application module knows about either of the others.</text>
  <text x="1005" y="985" class="detail">Adding another listener requires no changes to Thermometer, TemperatureSerialLogger, or TemperatureDisplay.</text>
</svg>
