name: Dependency documentation maintenance

on:
  push:
    branches:
      - feature/21-serializable-0.10.2-cascade-refresh

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README and changelog
        shell: python
        run: |
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          for value in ['5.8.1', '3.1.3', '2.2.3', '0.10.1']:
              if value not in text:
                  raise SystemExit(f'Missing expected README version: {value}')
          text = text.replace('5.8.1', '5.8.2')
          text = text.replace('3.1.3', '3.1.4')
          text = text.replace('2.2.3', '2.2.4')
          text = text.replace('0.10.1', '0.10.2')
          text = text.replace('Units 0.2.2', 'Units 0.2.3')
          text = text.replace('ESP-Now 0.5.1', 'ESP-Now 0.5.2')
          readme.write_text(text)

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text()
          if '## 5.8.2 — 2026-08-21' not in current:
              entry = '''# Changelog\n\n## 5.8.2 — 2026-08-21\n\n### Changed\n- Raised the required ESPressio Threads baseline from 3.1.3 to 3.1.4.\n- Raised the required ESPressio Timing baseline from 2.2.3 to 2.2.4.\n- Raised the optional ESPressio Serializable baseline from 0.10.1 to 0.10.2 for Serializable Events, runtime construction and Event Transport integrations.\n- Preserved the required ESPressio Observable baseline at `>=3.0.1 <4.0.0`.\n- Updated package, ESP-IDF component, README and dependency documentation for Event 5.8.2.\n- Preserved Security, Command, Sockets and ESP-Now as opt-in bridge dependencies and did not strengthen the existing Event↔ESP-Now or Event↔Sockets reciprocal optional relationships.\n\n### Compatibility\n- No Event, EventThread, listener, Observer, Event Transport, routing, bridge or wire-format API changes are introduced by this dependency-maintenance release.\n- Event Transport continues to use the existing ESPB v2 payload representation.\n\n'''
              if not current.startswith('# Changelog\n\n'):
                  raise SystemExit('Unexpected CHANGELOG header')
              current = entry + current[len('# Changelog\n\n'):]
              changelog.write_text(current)
      - name: Commit documentation update
        shell: bash
        run: |
          if git diff --quiet -- README.md CHANGELOG.md; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md CHANGELOG.md
          git commit -m 'docs: refresh Event 5.8.2 dependency references (#21)'
          git push
