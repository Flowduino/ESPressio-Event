name: Refresh dependency README

on:
  push:
    branches:
      - feature/19-dependency-refresh-5.8.1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/19-dependency-refresh-5.8.1
      - name: Refresh current-version documentation
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()

          start = text.index('## Latest Stable Version')
          end = text.index('## Compatibility', start)
          current = '''## Current Version — 5.8.1

ESPressio Event 5.8.1 is a dependency-maintenance patch over 5.8.0. It retains the expanded Observable-to-Event bridge surface while refreshing the required and optional dependency baselines.

Current dependency baselines:

```text
Required
    ESPressio Threads >= 3.1.3 < 4.0.0
    ESPressio Timing >= 2.2.3 < 3.0.0
    ESPressio Observable >= 3.0.1 < 4.0.0

Optional Serializable Event / Event Transport
    ESPressio Serializable >= 0.10.1 < 1.0.0

Optional observer bridge sources
    ESPressio Security >= 0.2.0 < 1.0.0
    ESPressio Command >= 0.3.0 < 1.0.0
    ESPressio Sockets >= 0.5.0 < 1.0.0
    ESPressio ESP-Now >= 0.5.0 < 1.0.0
```

The 5.8.1 patch does not add new bridge APIs or alter Event wire formats. It also documents that the Sockets-specific and ESP-Now-specific bridges currently create reciprocal optional dependency edges because those transport libraries already consume Event for concrete Event transports. The preferred future architecture moves those transport-specific bridges downstream into their respective Event integration layers (or dedicated integration packages), leaving Event transport-neutral.

'''
          text = text[:start] + current + text[end:]

          dep_start = text.index('### Required dependencies')
          dep_end_marker = '------------------------------------------------------------------------\n\n# What is Event-Driven Observer Pattern?'
          dep_end = text.index(dep_end_marker, dep_start)
          deps = '''### Required dependencies

Normal Event applications require:

```ini
lib_deps =
    flowduino/ESPressio-Event@^5.8.1
```

The mandatory dependency graph is:

```text
ESPressio Event 5.8.1
    |
    +-- ESPressio Threads >= 3.1.3 < 4.0.0
    |
    +-- ESPressio Observable >= 3.0.1 < 4.0.0
    |
    +-- ESPressio Timing >= 2.2.3 < 3.0.0
```

Timing carries Units 0.2.2 downstream. ESPressio Serializable is **not** a mandatory Event dependency; it is required only when Serializable Events, runtime Serializable Event construction, or Event Transport are selected:

```text
ESPressio Serializable >= 0.10.1 < 1.0.0
```

Security, Command, Sockets and ESP-Now remain optional bridge dependencies only. In particular, no new package-level Event -> Sockets or Event -> ESP-Now dependency is introduced by 5.8.1.

### Dependency direction and transport-specific bridges

The intended rule is that dependency edges cascade downstream. Event owns transport-neutral Event semantics and `IEventTransport`; concrete transport libraries may depend on Event to implement transports. Therefore transport-specific observer bridges should ultimately live downstream with those integrations rather than make Event depend back on a concrete transport.

Current compatibility retains the existing 5.8 bridge headers, but the preferred future locations are:

```text
Sockets Event integration
    SocketWorkerEventBridge
    SocketSecuritySessionEventBridge

ESP-Now Event integration
    ESPNowTransportEventBridge
```

Generic bridges for genuinely upstream libraries such as Timing, Threads, Command and Security remain appropriate in Event because those libraries do not depend back on Event.

'''
          text = text[:dep_start] + deps + text[dep_end:]
          path.write_text(text)
      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: refresh Event 5.8.1 README (#19)'
          git push origin HEAD:feature/19-dependency-refresh-5.8.1
