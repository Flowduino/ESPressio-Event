name: Refresh dependency README

on:
  push:
    branches:
      - feature/19-dependency-refresh-5.8.1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/19-dependency-refresh-5.8.1
      - name: Refresh current-version documentation
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          start = text.find('## Latest Stable Version')
          end = text.find('## Compatibility', start)
          if start >= 0 and end > start:
              current = """## Current Version — 5.8.1

ESPressio Event 5.8.1 is a dependency-maintenance patch over 5.8.0. It retains the expanded Observable-to-Event bridge surface while refreshing dependency baselines.

```text
Required
    ESPressio Threads >= 3.1.3 < 4.0.0
    ESPressio Timing >= 2.2.3 < 3.0.0
    ESPressio Observable >= 3.0.1 < 4.0.0

Optional Serializable Event / Event Transport
    ESPressio Serializable >= 0.10.1 < 1.0.0

Optional observer bridge sources
    ESPressio Security >= 0.2.0 < 1.0.0
    ESPressio Command >= 0.3.0 < 1.0.0
    ESPressio Sockets >= 0.5.0 < 1.0.0
    ESPressio ESP-Now >= 0.5.0 < 1.0.0
```

Transport-specific Event bridges for Sockets and ESP-Now are retained for 5.8.x compatibility, but their reciprocal optional dependency edges are documented for future downstream relocation.

"""
              text = text[:start] + current + text[end:]
          text = text.replace('flowduino/ESPressio-Event@^5.7.1', 'flowduino/ESPressio-Event@^5.8.1', 1)
          text = text.replace('ESPressio Event 5.7.1\n    |\n    +-- ESPressio Threads >= 3.1.2 < 4.0.0', 'ESPressio Event 5.8.1\n    |\n    +-- ESPressio Threads >= 3.1.3 < 4.0.0', 1)
          text = text.replace('+-- ESPressio Timing >= 2.2.2 < 3.0.0', '+-- ESPressio Timing >= 2.2.3 < 3.0.0', 1)
          text = text.replace('The 5.8.0 development branch retains the same mandatory graph. Security, Command, Sockets, and ESP-Now remain optional bridge dependencies only.', 'Event 5.8.1 retains the same dependency shape. Security, Command, Sockets, and ESP-Now remain optional bridge dependencies only.', 1)
          text = text.replace('required only when an application explicitly opts into Serializable\nEvents or Event Transport.', 'required only when an application explicitly opts into Serializable\nEvents or Event Transport. The validated current baseline is ESPressio Serializable >= 0.10.1 < 1.0.0.', 1)
          path.write_text(text)
      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: refresh Event 5.8.1 README (#19)'
          git push origin HEAD:feature/19-dependency-refresh-5.8.1
