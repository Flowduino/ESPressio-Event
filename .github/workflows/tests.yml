name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  migration-normalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'maintenance/47-repository-migration' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/47-repository-migration
      - name: Normalize repository identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          skip = {Path('.github/workflows/tests.yml'), Path('.github/workflows/migration-normalize.yml')}
          replacements = [
              ('https://github.com/Flowduino/', 'https://github.com/ESPressio-Development-Platform/'),
              ('https://github.com/flowduino/', 'https://github.com/ESPressio-Development-Platform/'),
              ('flowduino/ESPressio-', 'espressio-development-platform/ESPressio-'),
              ('Flowduino/ESPressio-', 'ESPressio-Development-Platform/ESPressio-'),
              ('https://flowduino.com', 'https://espressio.org'),
              ('http://flowduino.com', 'https://espressio.org'),
              ('Flowduino.com', 'espressio.org'),
              ('flowduino.com', 'espressio.org'),
              ('Flowduino ESPressio Development Platform', 'ESPressio Development Platform'),
              ('Flowduino ESPressio-', 'ESPressio-'),
              ('"name": "Flowduino"', '"name": "Simon J. Stuart"'),
              ('"owner": "flowduino"', '"owner": "espressio-development-platform"'),
          ]
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in skip:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed))
          PY
      - name: Commit normalized repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize remaining repository identity references (#47)'
            git push
          fi

  dependency-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Event dependency boundaries
        run: python tools/check_dependency_boundaries.py

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ESPressio-Event
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: 3.0.1
          path: ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: 2.2.4
          path: ESPressio_Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: 0.2.3
          path: ESPressio-Units
      - name: Configure
        run: cmake -S ESPressio-Event/tests -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  esp32-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Event
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: 3.0.1
          path: project/dependencies/ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: 0.2.3
          path: project/dependencies/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: 2.2.4
          path: project/dependencies/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Threads
          ref: 3.1.4
          path: project/dependencies/ESPressio-Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: 0.10.2
          path: project/dependencies/ESPressio-Serializable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create Event mechanism compile project
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags =
              -std=gnu++17
              -frtti
          build_unflags =
              -std=gnu++11
              -fno-rtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../dependencies/ESPressio-Threads
              ../dependencies/ESPressio-Serializable
              ../ESPressio-Event
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_Event.hpp>
          #include <ESPressio_EventTransport.hpp>
          #include <ESPressio_SystemClockEventBridge.hpp>
          #include <ESPressio_ThreadEventBridges.hpp>
          #include <ESPressio_SystemClockEventBridge_Serializable.hpp>
          #include <ESPressio_ThreadEventBridges_Serializable.hpp>

          void setup() {}
          void loop() {}
          EOF
      - name: Compile ESP32 Event mechanism and legitimate downstream bridges
        run: pio run -d project/compile
