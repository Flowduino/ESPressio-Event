name: tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ESPressio-Event
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Observable
          ref: 3.0.1
          path: ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Timing
          ref: main
          path: ESPressio_Timing
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Units
          ref: main
          path: ESPressio-Units
      - name: Configure
        run: cmake -S ESPressio-Event/tests -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  esp32-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Event
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Observable
          ref: 3.0.1
          path: project/dependencies/ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Serializable
          ref: 0.10.0
          path: project/dependencies/ESPressio-Serializable
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Units
          ref: main
          path: project/dependencies/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Timing
          ref: main
          path: project/dependencies/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Threads
          ref: main
          path: project/dependencies/ESPressio-Threads
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Security
          ref: 0.2.0
          path: project/dependencies/ESPressio-Security
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Command
          ref: 0.3.0
          path: project/dependencies/ESPressio-Command
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Sockets
          ref: 0.5.0
          path: project/dependencies/ESPressio-Sockets
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-ESP-Now
          ref: 0.5.0
          path: project/dependencies/ESPressio-ESP-Now
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create compile project
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags =
              -std=gnu++17
              -frtti
          build_unflags =
              -std=gnu++11
              -fno-rtti
          lib_extra_dirs = ../dependencies
          lib_deps =
              ../ESPressio-Event
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_EventThread.hpp>
          #include <ESPressio_Event_Serializable.hpp>
          #include <ESPressio_EventTransport.hpp>
          #include <ESPressio_TransportSecurityEventBridge.hpp>
          #include <ESPressio_CommandRegistryEventBridge.hpp>
          #include <ESPressio_SocketWorkerEventBridge.hpp>
          #include <ESPressio_SocketSecuritySessionEventBridge.hpp>
          #include <ESPressio_ESPNowTransportEventBridge.hpp>

          class CompileEvent final :
              public ESPressio::Event::SerializableEvent<CompileEvent> {
          public:
              uint32_t Value = 7;
              ESPRESSIO_SERIALIZABLE_TYPE(CompileEvent)
              ESPRESSIO_SERIALIZABLE_SCHEMA_VERSION(1)
              ESPRESSIO_SERIALIZABLE_PROPERTIES(
                  ESPRESSIO_PROPERTY("value", Value)
              )
          };

          ESPRESSIO_EVENT_TRANSPORT_TYPE(
              CompileEvent,
              "flowduino.ci.compile.v1"
          )

          class CompileTransport final :
              public ESPressio::Event::IEventTransport {
              ESPressio::Event::IEventTransportReceiver* receiver = nullptr;
          public:
              bool Send(const ESPressio::Event::EventTransportPacket&) override {
                  return true;
              }
              void SetReceiver(
                  ESPressio::Event::IEventTransportReceiver* value
              ) override {
                  receiver = value;
              }
          };

          class CompileListener final : public ESPressio::Event::EventThread {
              ESPressio::Event::EventListenerHandlePtr handle;
          public:
              CompileListener() : ESPressio::Event::EventThread(false) {}
              void Register() {
                  handle = RegisterListener<CompileEvent>(
                      [](CompileEvent*,
                         ESPressio::Event::EventDispatchMethod,
                         ESPressio::Event::EventPriority) {}
                  );
              }
          };

          CompileTransport transport;
          CompileListener listener;

          void setup() {
              auto& manager =
                  ESPressio::Event::EventTransportManager::GetInstance();
              manager.RegisterTransport(&transport);
              manager.RegisterBidirectionalEvent<CompileEvent>(&transport);
              manager.Initialize();
              listener.Register();
              auto* event = new CompileEvent();
              event->Queue();
          }

          void loop() {}
          EOF
      - name: Compile ESP32 target and optional bridges
        run: pio run -d project/compile
